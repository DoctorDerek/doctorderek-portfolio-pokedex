name: Playwright E2E Pipeline

on:
  deployment_status:

permissions:
  pull-requests: write
  contents: read
  id-token: write

jobs:
  e2e:
    name: Playwright E2E Tests
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Get Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Get GitHub OIDC Token
        id: github-oidc-token
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          retries: 3
          script: |
            const token = await core.getIDToken()
            core.setSecret(token)
            core.setOutput("token", token)

      - name: Run Playwright Tests and Capture Summary
        id: playwright
        run: |
          set +e
          pnpm exec playwright test --pass-with-no-tests 2>&1 | tee "$RUNNER_TEMP/playwright-output.txt"
          PLAYWRIGHT_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "PLAYWRIGHT_EXIT_CODE=$PLAYWRIGHT_EXIT_CODE" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_OUTPUT_FILE=$RUNNER_TEMP/playwright-output.txt" >> "$GITHUB_ENV"
          exit "$PLAYWRIGHT_EXIT_CODE"
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.deployment_status.target_url }}
          PLAYWRIGHT_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.github-oidc-token.outputs.token }}

      - name: Remove Preview Credentials from Test Evidence
        id: sanitize-evidence
        if: ${{ !cancelled() && steps.playwright.outcome != 'skipped' }}
        run: |
          python3 -B -m unittest discover -s tests -p 'test_sanitizePlaywrightEvidence.py'
          python3 -B scripts/sanitizePlaywrightEvidence.py
        env:
          PLAYWRIGHT_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.github-oidc-token.outputs.token }}

      - name: Inspect Playwright Evidence
        if: ${{ !cancelled() }}
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const expectedCommit = context.payload.deployment.sha;
            let evidence;
            try {
              const results = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
              const projects = results.config.projects.map(project => project.name);
              const missingProjects = ['chromium', 'firefox', 'webkit'].filter(project => !projects.includes(project));
              const executedProjects = new Set();
              const visit = suites => suites.forEach(suite => {
                suite.specs.forEach(spec => spec.tests.forEach(test => {
                  if (test.results.some(result => result.status !== 'skipped')) executedProjects.add(test.projectName);
                }));
                visit(suite.suites ?? []);
              });
              visit(results.suites);
              const unexecutedProjects = projects.filter(project => !executedProjects.has(project));
              const htmlAvailable = fs.existsSync('playwright-report/index.html');
              evidence = { commit, expectedCommit, projects, missingProjects, unexecutedProjects, htmlAvailable, stats: results.stats, runnerExitCode: process.env.PLAYWRIGHT_EXIT_CODE, browserCodeCoverage: 'not collected' };
              if (commit !== expectedCommit || missingProjects.length || unexecutedProjects.length || !htmlAvailable) {
                core.warning('Playwright evidence is incomplete; inspect evidence.json for missing contributions.');
              }
            } catch {
              evidence = { commit, expectedCommit, status: 'unavailable', browserCodeCoverage: 'not collected' };
              core.warning('Playwright results are unavailable; preserving any partial reports.');
            }
            fs.mkdirSync('test-results', { recursive: true });
            fs.writeFileSync('test-results/evidence.json', JSON.stringify(evidence, null, 2));
            await core.summary.addHeading('Playwright test evidence')
              .addCodeBlock(JSON.stringify(evidence, null, 2), 'json')
              .addRaw('\nHTML, JSON, and traces describe test execution, not application code coverage.\n')
              .write();

      - name: Upload Playwright Report
        if: ${{ !cancelled() && steps.sanitize-evidence.outcome == 'success' && hashFiles('playwright-report/**', 'test-results/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Post Playwright PR Comment
        if: ${{ !cancelled() && (steps.playwright.outcome == 'skipped' || steps.sanitize-evidence.outcome == 'success') }}
        continue-on-error: true
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const deploymentSha = context.payload.deployment.sha;
            const deploymentRef = context.payload.deployment.ref;
            const outputPath = process.env.PLAYWRIGHT_OUTPUT_FILE;
            const output = outputPath && fs.existsSync(outputPath)
              ? fs.readFileSync(outputPath, 'utf8')
              : '';
            const cleanOutput = output.replace(/\u001b\[[0-9;]*m/g, '');
            const exitCode = Number.parseInt(process.env.PLAYWRIGHT_EXIT_CODE ?? '', 10);
            const header = '### 🎭 Playwright';
            const qualityPosition = '**Quality check 3 of 3**';
            const summaryLines = cleanOutput
              .split(/\r?\n/)
              .filter(line => /Running \d+ tests?|\d+ (passed|failed|flaky|skipped)|Error:/.test(line))
              .slice(-12);
            const fallbackLines = cleanOutput
              .split(/\r?\n/)
              .filter(Boolean)
              .slice(-12);
            const summary = (summaryLines.length > 0 ? summaryLines : fallbackLines).join('\n');
            const status = Number.isInteger(exitCode) && exitCode === 0
              ? '✅ **Playwright completed successfully.**'
              : '❌ **Playwright tests failed or the runner could not complete.**';
            const previewUrl = context.payload.deployment_status.target_url;
            const previewLink = previewUrl ? `\n\n[Open preview deployment](${previewUrl})` : '';
            const body = `${header}\n\n${qualityPosition}\n\n${status}${summary ? `\n\n\`\`\`text\n${summary}\n\`\`\`` : ''}${previewLink}`;

            const { data: associatedPullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: deploymentSha,
            });
            let pullRequests = associatedPullRequests;

            if (pullRequests.length === 0 && deploymentRef) {
              const { data: matchingPullRequests } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${deploymentRef}`,
                state: 'open',
              });
              pullRequests = matchingPullRequests;
            }

            const pullRequest = pullRequests.find(
              candidate => candidate.state === 'open' && candidate.head.sha === deploymentSha,
            ) ?? pullRequests.find(candidate => candidate.state === 'open') ?? pullRequests[0];

            if (!pullRequest) {
              core.warning(`No pull request is associated with deployment ${deploymentSha}.`);
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: pullRequest.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const botComment = comments.find(
              comment => comment.user.type === 'Bot' && comment.body?.includes(header),
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: pullRequest.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Enforce Playwright Result
        if: ${{ !cancelled() }}
        run: |
          if ! [[ "$PLAYWRIGHT_EXIT_CODE" =~ ^[0-9]+$ ]] || [ "$PLAYWRIGHT_EXIT_CODE" -ne 0 ]; then
            echo "Playwright tests failed or the runner could not complete."
            exit 1
          fi
